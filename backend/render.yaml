services:
  - type: web
    name: digital-calendar-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: PORT
        value: 8000
    disk:
      name: uploads-disk
      mountPath: /var/data
      sizeGB: 10